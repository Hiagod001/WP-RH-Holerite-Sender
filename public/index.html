<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RH Uai Telecom - Holerites</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --brand-900: #7f1d1d;
            --brand-800: #991b1b;
            --brand-700: #b91c1c;
            --brand-100: #ffe4e6;
            --brand-50: #fff1f2;
            --surface: #fffafa;
            --surface-strong: #ffffff;
            --surface-muted: #fff7f7;
            --border: #f1b7bf;
            --border-strong: #e28b96;
            --text: #1f2937;
            --muted: #6b7280;
        }

        body {
            background: var(--surface-muted);
            color: var(--text);
        }

        .app-header,
        .app-card,
        .table-shell {
            background: var(--surface-strong);
            border: 1px solid var(--border);
            border-radius: 8px;
            box-shadow: 0 12px 30px rgba(127, 29, 29, 0.08);
        }

        .app-header {
            border-left: 6px solid var(--brand-700);
        }

        .eyebrow {
            color: var(--brand-800);
            font-size: 0.75rem;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .card-title {
            color: var(--brand-900);
            font-size: 0.9rem;
            font-weight: 800;
        }

        .card-divider {
            border-color: var(--border);
        }

        .field-label {
            color: #4b5563;
            font-size: 0.75rem;
            font-weight: 800;
        }

        .field-control {
            width: 100%;
            min-height: 2.75rem;
            border: 1px solid var(--border-strong);
            border-radius: 8px;
            background: #ffffff;
            color: #111827;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
        }

        .field-control:focus {
            border-color: var(--brand-700);
            box-shadow: 0 0 0 3px rgba(185, 28, 28, 0.16);
            background: #fffdfd;
        }

        .btn {
            min-height: 2.5rem;
            border-radius: 8px;
            padding: 0 0.85rem;
            font-size: 0.875rem;
            font-weight: 800;
            transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease, transform 0.15s ease;
        }

        .btn:hover {
            transform: translateY(-1px);
        }

        .btn-primary {
            background: var(--brand-700);
            color: white;
        }

        .btn-primary:hover {
            background: var(--brand-800);
        }

        .btn-secondary {
            background: var(--brand-50);
            border: 1px solid var(--border-strong);
            color: var(--brand-900);
        }

        .btn-secondary:hover {
            background: var(--brand-100);
        }

        .btn-dark {
            background: #1f2937;
            color: white;
        }

        .btn-dark:hover {
            background: #111827;
        }

        .btn-danger {
            border: 1px solid #fca5a5;
            background: #fff5f5;
            color: #991b1b;
        }

        .btn-danger:hover {
            background: #fee2e2;
        }

        .status-pill {
            width: fit-content;
            border-radius: 8px;
            padding: 0.6rem 0.85rem;
            font-size: 0.875rem;
            font-weight: 800;
            border: 1px solid var(--border);
            background: white;
            color: #374151;
        }

        .status-connected {
            border-color: #86efac;
            background: #dcfce7;
            color: #166534;
        }

        .status-warning {
            border-color: #facc15;
            background: #fef9c3;
            color: #854d0e;
        }

        .status-error {
            border-color: #fca5a5;
            background: #fee2e2;
            color: #991b1b;
        }

        .status-line {
            font-size: 0.875rem;
            font-weight: 800;
        }

        .text-success {
            color: #15803d;
        }

        .text-error {
            color: #b91c1c;
        }

        .text-default {
            color: #4b5563;
        }

        .metric-box {
            background: linear-gradient(180deg, #fffafa 0%, #fff1f2 100%);
        }

        .table-head {
            background: var(--brand-50);
            color: var(--brand-900);
        }

        .table-row:hover {
            background: #fff7f7;
        }

        .state-badge {
            border-radius: 8px;
            padding: 0.3rem 0.55rem;
            font-size: 0.75rem;
            font-weight: 900;
        }

        .state-ready {
            background: #dcfce7;
            color: #166534;
        }

        .state-pending {
            background: #fee2e2;
            color: #991b1b;
        }
    </style>
</head>
<body class="min-h-screen">
    <main class="mx-auto flex w-full max-w-7xl flex-col gap-4 p-4 md:p-6">
        <header class="app-header flex flex-col gap-3 p-4 md:flex-row md:items-center md:justify-between">
            <div>
                <p class="eyebrow">Uai Telecom</p>
                <h1 class="text-2xl font-black text-zinc-950">RH - Envio de holerites</h1>
            </div>
            <div class="flex flex-col gap-2 sm:flex-row sm:items-center">
                <div id="status-message" class="status-pill">
                    Iniciando verificacao...
                </div>
                <button onclick="resetConnection()" id="reset-button" class="btn btn-danger hidden">
                    Novo QR
                </button>
            </div>
        </header>

        <section class="grid grid-cols-1 gap-4 xl:grid-cols-[390px_minmax(0,1fr)]">
            <aside class="flex flex-col gap-4">
                <div class="app-card p-4">
                    <div class="mb-3 flex items-center justify-between gap-3">
                        <h2 class="card-title">WhatsApp</h2>
                        <p id="status-detail" class="text-xs font-bold text-zinc-600"></p>
                    </div>
                    <div id="qrcode-wrapper" class="flex min-h-[280px] w-full flex-col items-center justify-center rounded-lg border border-dashed bg-rose-50" style="border-color: var(--border-strong);">
                        <div id="qrcode" class="flex min-h-[256px] items-center justify-center"></div>
                        <p id="qr-updated-at" class="mt-3 hidden text-xs font-semibold text-zinc-600"></p>
                    </div>
                    <p id="session-status" class="status-line mt-2"></p>
                </div>

                <div class="app-card p-4">
                    <div class="mb-3 flex items-center justify-between gap-3 border-b pb-3 card-divider">
                        <h2 class="card-title">Colaborador</h2>
                        <button onclick="clearEmployeeForm()" class="btn btn-secondary min-h-9 text-xs">
                            Limpar
                        </button>
                    </div>
                    <div class="flex flex-col gap-3">
                        <label class="field-label flex flex-col gap-1">
                            Nome
                            <input id="employee-name" type="text" class="field-control px-3 font-normal">
                        </label>
                        <label class="field-label flex flex-col gap-1">
                            WhatsApp
                            <input id="employee-phone" type="text" placeholder="5534999999999" class="field-control px-3 font-normal">
                        </label>
                        <button onclick="saveEmployee()" id="employee-save-button" class="btn btn-primary">
                            Salvar colaborador
                        </button>
                        <p id="employee-status" class="status-line"></p>
                    </div>
                </div>

                <div class="app-card p-4">
                    <h2 class="card-title mb-3 border-b pb-3 card-divider">Envio do mes</h2>
                    <div class="grid grid-cols-2 gap-3">
                        <label class="field-label col-span-2 flex flex-col gap-1">
                            Mes
                            <input id="payslip-month" type="month" class="field-control px-3 font-normal">
                        </label>
                        <label class="field-label flex flex-col gap-1">
                            Delay min
                            <input id="delay-min" type="number" min="5" value="45" class="field-control px-3 font-normal">
                        </label>
                        <label class="field-label flex flex-col gap-1">
                            Delay max
                            <input id="delay-max" type="number" min="5" value="90" class="field-control px-3 font-normal">
                        </label>
                    </div>
                    <label class="field-label mt-3 flex flex-col gap-1">
                        Mensagem
                        <textarea id="payslip-message" class="field-control min-h-[120px] resize-y p-3 font-normal"></textarea>
                    </label>
                    <div class="mt-3 grid grid-cols-1 gap-2 sm:grid-cols-2">
                        <button onclick="loadPayslipPreview()" class="btn btn-secondary">
                            Conferir
                        </button>
                        <button onclick="sendPayslips()" id="send-payslips-button" class="btn btn-primary">
                            Enviar holerites
                        </button>
                    </div>
                    <p id="payslip-status" class="status-line mt-2"></p>
                </div>
            </aside>

            <section class="table-shell overflow-hidden">
                <div class="grid grid-cols-3 border-b text-center text-sm card-divider">
                    <div class="metric-box p-3">
                        <p class="text-xs font-black uppercase tracking-wide text-zinc-600">Colaboradores</p>
                        <p id="payslip-total" class="text-2xl font-black text-zinc-950">0</p>
                    </div>
                    <div class="metric-box border-x p-3 card-divider">
                        <p class="text-xs font-black uppercase tracking-wide text-zinc-600">Prontos</p>
                        <p id="payslip-ready" class="text-2xl font-black text-green-700">0</p>
                    </div>
                    <div class="metric-box p-3">
                        <p class="text-xs font-black uppercase tracking-wide text-zinc-600">Pendentes</p>
                        <p id="payslip-missing" class="text-2xl font-black text-red-800">0</p>
                    </div>
                </div>

                <div class="flex flex-col gap-3 border-b p-4 card-divider lg:flex-row lg:items-center lg:justify-between">
                    <div>
                        <h2 class="text-base font-black text-zinc-950">Colaboradores e holerites</h2>
                        <p id="payslip-paths" class="mt-1 text-xs font-semibold text-zinc-600"></p>
                    </div>
                    <input id="employee-search" type="search" placeholder="Buscar colaborador" class="field-control h-10 px-3 lg:max-w-xs">
                </div>

                <input id="payslip-file-input" type="file" accept="application/pdf" class="hidden">

                <div class="max-h-[660px] overflow-auto">
                    <table class="w-full min-w-[820px] text-left text-sm">
                        <thead class="table-head sticky top-0 text-xs uppercase tracking-wide">
                            <tr>
                                <th class="px-4 py-3">Colaborador</th>
                                <th class="px-4 py-3">WhatsApp</th>
                                <th class="px-4 py-3">PDF</th>
                                <th class="px-4 py-3">Status</th>
                                <th class="px-4 py-3 text-right">Acoes</th>
                            </tr>
                        </thead>
                        <tbody id="payslip-preview-body" class="divide-y divide-rose-100">
                            <tr>
                                <td colspan="5" class="px-4 py-6 text-center font-semibold text-zinc-600">Carregando colaboradores.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </section>
    </main>

    <script>
        const statusMessage = document.getElementById('status-message');
        const statusDetail = document.getElementById('status-detail');
        const qrCodeContainer = document.getElementById('qrcode');
        const qrCodeWrapper = document.getElementById('qrcode-wrapper');
        const qrUpdatedAt = document.getElementById('qr-updated-at');
        const sessionStatus = document.getElementById('session-status');
        const resetButton = document.getElementById('reset-button');
        const payslipMonth = document.getElementById('payslip-month');
        const payslipStatus = document.getElementById('payslip-status');
        const payslipPreviewBody = document.getElementById('payslip-preview-body');
        const payslipMessage = document.getElementById('payslip-message');
        const sendPayslipsButton = document.getElementById('send-payslips-button');
        const employeeName = document.getElementById('employee-name');
        const employeePhone = document.getElementById('employee-phone');
        const employeeStatus = document.getElementById('employee-status');
        const employeeSaveButton = document.getElementById('employee-save-button');
        const employeeSearch = document.getElementById('employee-search');
        const fileInput = document.getElementById('payslip-file-input');

        const qrCode = new QRCode(qrCodeContainer, {
            width: 256,
            height: 256,
            colorDark: '#7f1d1d',
            colorLight: '#ffffff'
        });

        let lastQrString = '';
        let lastUpdatedAt = '';
        let isCheckingStatus = false;
        let isConnected = false;
        let editingEmployeeId = '';
        let uploadEmployeeId = '';
        let previewRows = [];

        function getCurrentMonthValue() {
            const now = new Date();
            return now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0');
        }

        function escapeHtml(value) {
            return String(value || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function setTextStatus(element, message, type) {
            element.textContent = message;
            element.className = 'status-line';
            element.classList.add(type === 'error' ? 'text-error' : type === 'success' ? 'text-success' : 'text-default');
        }

        function setStatusStyles(type) {
            statusMessage.className = 'status-pill';

            if (type === 'connected') {
                statusMessage.classList.add('status-connected');
                return;
            }

            if (type === 'warning') {
                statusMessage.classList.add('status-warning');
                return;
            }

            if (type === 'error') {
                statusMessage.classList.add('status-error');
                return;
            }
        }

        function renderQrCode(qrString, updatedAt) {
            qrCodeWrapper.style.display = 'flex';
            qrUpdatedAt.classList.remove('hidden');

            if (qrString !== lastQrString || updatedAt !== lastUpdatedAt) {
                qrCode.clear();
                qrCode.makeCode(qrString);
                lastQrString = qrString;
                lastUpdatedAt = updatedAt || '';
            }

            qrUpdatedAt.textContent = updatedAt
                ? 'Atualizado: ' + new Date(updatedAt).toLocaleTimeString('pt-BR')
                : '';
        }

        function clearQrCode() {
            qrCode.clear();
            qrCodeContainer.innerHTML = '';
            lastQrString = '';
            lastUpdatedAt = '';
            qrUpdatedAt.textContent = '';
            qrUpdatedAt.classList.add('hidden');
        }

        async function checkStatus() {
            if (isCheckingStatus) {
                return;
            }

            isCheckingStatus = true;

            try {
                const response = await fetch('/api/whatsapp-status?t=' + Date.now(), {
                    cache: 'no-store',
                    headers: {
                        'Accept': 'application/json',
                        'Cache-Control': 'no-cache'
                    }
                });

                const data = await response.json();
                statusDetail.textContent = data.message || '';

                if (data.status === 'connected') {
                    isConnected = true;
                    setStatusStyles('connected');
                    statusMessage.textContent = 'WhatsApp conectado';
                    clearQrCode();
                    qrCodeWrapper.style.display = 'none';
                    resetButton.classList.remove('hidden');
                    sendPayslipsButton.disabled = false;
                    sendPayslipsButton.classList.remove('opacity-60');
                    return;
                }

                isConnected = false;
                sendPayslipsButton.disabled = true;
                sendPayslipsButton.classList.add('opacity-60');
                resetButton.classList.add('hidden');
                qrCodeWrapper.style.display = 'flex';

                if (data.status === 'waiting_qr' && data.qr_string) {
                    setStatusStyles('warning');
                    statusMessage.textContent = 'Leia o QR code';
                    renderQrCode(data.qr_string, data.updated_at);
                    return;
                }

                if (data.status === 'logged_out' || data.status === 'error') {
                    setStatusStyles('error');
                    statusMessage.textContent = 'Conexao indisponivel';
                    clearQrCode();
                    return;
                }

                setStatusStyles('default');
                statusMessage.textContent = 'Preparando conexao';
                clearQrCode();
            } catch (error) {
                isConnected = false;
                setStatusStyles('error');
                statusMessage.textContent = 'Falha ao consultar conexao';
                statusDetail.textContent = 'Tentando novamente automaticamente...';
            } finally {
                isCheckingStatus = false;
            }
        }

        function clearEmployeeForm() {
            editingEmployeeId = '';
            employeeName.value = '';
            employeePhone.value = '';
            employeeSaveButton.textContent = 'Salvar colaborador';
            employeeStatus.textContent = '';
        }

        async function saveEmployee() {
            const payload = {
                name: employeeName.value.trim(),
                phone: employeePhone.value.replace(/\D/g, '')
            };

            if (!payload.name || !payload.phone) {
                setTextStatus(employeeStatus, 'Preencha nome e WhatsApp.', 'error');
                return;
            }

            setTextStatus(employeeStatus, 'Salvando...', 'default');

            try {
                const response = await fetch(editingEmployeeId ? '/api/hr/employees/' + encodeURIComponent(editingEmployeeId) : '/api/hr/employees', {
                    method: editingEmployeeId ? 'PUT' : 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });
                const data = await response.json().catch(() => ({
                    status: 'error',
                    message: 'Resposta invalida do servidor'
                }));

                if (response.ok && data.status === 'success') {
                    setTextStatus(employeeStatus, 'Colaborador salvo.', 'success');
                    clearEmployeeForm();
                    await loadPayslipPreview();
                    return;
                }

                setTextStatus(employeeStatus, data.message || 'Erro ao salvar.', 'error');
            } catch (error) {
                setTextStatus(employeeStatus, 'Erro ao salvar colaborador.', 'error');
            }
        }

        function editEmployee(id) {
            const employee = previewRows.find((item) => item.id === id);

            if (!employee) {
                return;
            }

            editingEmployeeId = id;
            employeeName.value = employee.name || '';
            employeePhone.value = employee.phone || '';
            employeeSaveButton.textContent = 'Atualizar colaborador';
            setTextStatus(employeeStatus, 'Editando ' + (employee.name || 'colaborador') + '.', 'default');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        async function deleteEmployee(id) {
            const employee = previewRows.find((item) => item.id === id);
            const name = employee?.name || 'este colaborador';

            if (!confirm('Remover ' + name + '?')) {
                return;
            }

            try {
                const response = await fetch('/api/hr/employees/' + encodeURIComponent(id), {
                    method: 'DELETE',
                    headers: {
                        'Accept': 'application/json'
                    }
                });
                const data = await response.json().catch(() => ({
                    status: 'error',
                    message: 'Resposta invalida do servidor'
                }));

                if (response.ok && data.status === 'success') {
                    await loadPayslipPreview();
                    return;
                }

                setTextStatus(payslipStatus, data.message || 'Erro ao remover.', 'error');
            } catch (error) {
                setTextStatus(payslipStatus, 'Erro ao remover colaborador.', 'error');
            }
        }

        function choosePayslipFile(id) {
            uploadEmployeeId = id;
            fileInput.value = '';
            fileInput.click();
        }

        async function uploadSelectedPayslip() {
            if (!uploadEmployeeId || !fileInput.files.length) {
                return;
            }

            const formData = new FormData();
            formData.append('month', payslipMonth.value || getCurrentMonthValue());
            formData.append('file', fileInput.files[0]);
            setTextStatus(payslipStatus, 'Anexando PDF...', 'default');

            try {
                const response = await fetch('/api/hr/employees/' + encodeURIComponent(uploadEmployeeId) + '/payslip', {
                    method: 'POST',
                    headers: {
                        'Accept': 'application/json'
                    },
                    body: formData
                });
                const data = await response.json().catch(() => ({
                    status: 'error',
                    message: 'Resposta invalida do servidor'
                }));

                if (response.ok && data.status === 'success') {
                    setTextStatus(payslipStatus, 'PDF anexado.', 'success');
                    await loadPayslipPreview();
                    return;
                }

                setTextStatus(payslipStatus, data.message || 'Erro ao anexar PDF.', 'error');
            } catch (error) {
                setTextStatus(payslipStatus, 'Erro ao anexar PDF.', 'error');
            }
        }

        function renderPayslipPreview(data) {
            document.getElementById('payslip-total').textContent = data.total_employees || 0;
            document.getElementById('payslip-ready').textContent = data.ready_count || 0;
            document.getElementById('payslip-missing').textContent = data.missing_count || 0;
            previewRows = data.results || [];

            const query = employeeSearch.value.trim().toLowerCase();
            const filteredRows = previewRows.filter((item) => {
                const haystack = `${item.name || ''} ${item.phone || ''} ${item.payslip_file || ''}`.toLowerCase();
                return haystack.includes(query);
            });

            if (!filteredRows.length) {
                payslipPreviewBody.innerHTML = '<tr><td colspan="5" class="px-4 py-6 text-center font-semibold text-zinc-600">Nenhum colaborador encontrado.</td></tr>';
                return;
            }

            payslipPreviewBody.innerHTML = filteredRows.map((item) => {
                const ready = item.phone && item.phone.length >= 12 && item.payslip_file;
                const statusClass = ready ? 'state-ready' : 'state-pending';
                const statusText = ready ? 'Pronto' : 'Pendente';

                return `
                    <tr class="table-row">
                        <td class="px-4 py-3 font-bold text-zinc-950">${escapeHtml(item.name || '-')}</td>
                        <td class="px-4 py-3 font-semibold text-zinc-700">${escapeHtml(item.phone || '-')}</td>
                        <td class="px-4 py-3 font-semibold text-zinc-700">${escapeHtml(item.payslip_file || '-')}</td>
                        <td class="px-4 py-3"><span class="state-badge ${statusClass}">${statusText}</span></td>
                        <td class="px-4 py-3">
                            <div class="flex justify-end gap-2">
                                <button onclick="choosePayslipFile('${escapeHtml(item.id)}')" class="btn btn-dark min-h-9 px-3 text-xs">PDF</button>
                                <button onclick="editEmployee('${escapeHtml(item.id)}')" class="btn btn-secondary min-h-9 px-3 text-xs">Editar</button>
                                <button onclick="deleteEmployee('${escapeHtml(item.id)}')" class="btn btn-danger min-h-9 px-3 text-xs">Excluir</button>
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        async function loadPayslipPreview() {
            const month = payslipMonth.value || getCurrentMonthValue();
            payslipMonth.value = month;
            document.getElementById('payslip-paths').textContent = 'Mes selecionado: ' + month;
            setTextStatus(payslipStatus, 'Conferindo colaboradores...', 'default');

            try {
                const response = await fetch('/api/payslips-preview?month=' + encodeURIComponent(month), {
                    cache: 'no-store',
                    headers: {
                        'Accept': 'application/json'
                    }
                });
                const data = await response.json().catch(() => ({
                    status: 'error',
                    message: 'Resposta invalida do servidor'
                }));

                if (response.ok && data.status === 'success') {
                    renderPayslipPreview(data);
                    const message = data.missing_count
                        ? `${data.missing_count} pendencia(s) para resolver.`
                        : 'Tudo pronto para envio.';
                    setTextStatus(payslipStatus, message, data.missing_count ? 'error' : 'success');
                    return;
                }

                setTextStatus(payslipStatus, data.message || 'Erro ao conferir holerites.', 'error');
            } catch (error) {
                setTextStatus(payslipStatus, 'Erro ao conferir holerites.', 'error');
            }
        }

        async function sendPayslips() {
            const month = payslipMonth.value || getCurrentMonthValue();
            const minDelay = Number(document.getElementById('delay-min').value || 45);
            const maxDelay = Number(document.getElementById('delay-max').value || 90);

            if (!isConnected) {
                setTextStatus(payslipStatus, 'Conecte o WhatsApp antes de enviar.', 'error');
                return;
            }

            if (maxDelay < minDelay) {
                setTextStatus(payslipStatus, 'O delay maximo precisa ser maior ou igual ao minimo.', 'error');
                return;
            }

            sendPayslipsButton.disabled = true;
            sendPayslipsButton.classList.add('opacity-60');
            setTextStatus(payslipStatus, 'Enviando holerites. Mantenha esta janela aberta.', 'default');

            try {
                const response = await fetch('/api/send-payslips', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({
                        month,
                        min_delay_seconds: minDelay,
                        max_delay_seconds: maxDelay,
                        message: payslipMessage.value
                    })
                });
                const data = await response.json().catch(() => ({
                    status: 'error',
                    message: 'Resposta invalida do servidor'
                }));

                if (response.ok && data.status === 'success') {
                    setTextStatus(payslipStatus, `${data.message} Relatorio: ${data.report_path}`, data.error_count ? 'error' : 'success');
                    await loadPayslipPreview();
                    return;
                }

                setTextStatus(payslipStatus, data.message || 'Erro ao enviar holerites.', 'error');
            } catch (error) {
                setTextStatus(payslipStatus, 'Erro ao enviar holerites.', 'error');
            } finally {
                sendPayslipsButton.disabled = !isConnected;
                sendPayslipsButton.classList.toggle('opacity-60', !isConnected);
            }
        }

        async function resetConnection() {
            setTextStatus(sessionStatus, 'Reiniciando sessao...', 'default');

            try {
                const response = await fetch('/api/reset-connection', {
                    method: 'POST',
                    headers: {
                        'Accept': 'application/json'
                    }
                });
                const data = await response.json().catch(() => ({
                    status: 'error',
                    message: 'Resposta invalida do servidor'
                }));

                if (response.ok && data.status === 'success') {
                    setTextStatus(sessionStatus, data.message, 'success');
                    return;
                }

                setTextStatus(sessionStatus, data.message || 'Erro ao reiniciar sessao.', 'error');
            } catch (error) {
                setTextStatus(sessionStatus, 'Erro ao reiniciar a conexao.', 'error');
            }
        }

        payslipMonth.value = getCurrentMonthValue();
        payslipMessage.value = [
            'Ola {nome}, tudo bem?',
            '',
            'Segue em anexo o seu holerite referente a {mes}.',
            '',
            'Atenciosamente,',
            'RH Uai Telecom'
        ].join('\n');

        payslipMonth.addEventListener('change', loadPayslipPreview);
        employeeSearch.addEventListener('input', () => {
            renderPayslipPreview({
                total_employees: previewRows.length,
                ready_count: previewRows.filter((item) => item.phone && item.phone.length >= 12 && item.payslip_file).length,
                missing_count: previewRows.filter((item) => !(item.phone && item.phone.length >= 12 && item.payslip_file)).length,
                results: previewRows
            });
        });
        fileInput.addEventListener('change', uploadSelectedPayslip);

        loadPayslipPreview();
        checkStatus();
        setInterval(checkStatus, 1500);
    </script>
</body>
</html>
